[package]
name = "sirraya-qutub"
version = "0.1.12"
edition = "2021"
rust-version = "1.75"
authors = ["Sirraya Labs"]
description = "A quantum state-vector and density-matrix simulator in Rust, with a quantum reservoir computing module."
license = "MIT"
repository = "https://github.com/sirraya-labs/QuTub-Core"
homepage = "https://github.com/sirraya-labs/QuTub-Core"
documentation = "https://docs.rs/sirraya-qutub"
readme = "README.md"
keywords = ["quantum", "simulation", "reservoir-computing", "physics"]
categories = ["science", "simulation"]

# Explicit lib + bin targets. Cargo would auto-detect both src/lib.rs and
# src/main.rs even without this, but spelling it out documents intent now
# that the crate is a real library (used by main.rs itself, and by anyone
# depending on `sirraya-qutub` from crates.io) rather than a bare binary.
[lib]
name = "sirraya_qutub"
path = "src/lib.rs"
doctest = true
# Opt this crate's functions/types out of docs.rs's "scrape examples"
# feature (-Z rustdoc-scrape-examples), which was crashing rustdoc itself
# with an internal panic in its syntax highlighter (`exit_elem` called on
# empty class stack parent) while trying to embed highlighted call-site
# snippets into the generated docs. This is a rustdoc ICE, not a bug in
# this crate -- disabling scraping sidesteps the code path that panics.
doc-scrape-examples = false

[[bin]]
name = "sirraya-qutub"
path = "src/main.rs"
# Avoid the bin/lib output-filename collision (cargo#6313): with an
# explicit [lib] name of `sirraya_qutub`, the bin target `sirraya-qutub`
# normalizes to the same doc output path and one target's rustdoc output
# silently overwrites the other's.
doc = false

[dependencies]
rand = "0.8"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# docs.rs configuration
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
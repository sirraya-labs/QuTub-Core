[package]
name = "sirraya-qutub"
version = "0.1.13"
edition = "2021"
rust-version = "1.75"
authors = ["Sirraya Labs"]
description = "A quantum state-vector and density-matrix simulator in Rust, with a quantum reservoir computing module."
license = "MIT"
repository = "https://github.com/sirraya-labs/QuTub-Core"
homepage = "https://github.com/sirraya-labs/QuTub-Core"
documentation = "https://docs.rs/sirraya-qutub"
readme = "README.md"
keywords = ["quantum", "simulation", "reservoir-computing", "physics"]
categories = ["science", "simulation"]

[lib]
name = "sirraya_qutub"
path = "src/lib.rs"
doctest = true
doc-scrape-examples = false

[[bin]]
name = "sirraya-qutub"
path = "src/main.rs"
doc = false

# Every example target below is explicitly opted out of docs.rs's
# "scrape examples" feature. With 10 example files that all exercise
# the same core QuantumRegister API (apply_hadamard, apply_cnot,
# measure_all_qubits, etc.), several library items ended up with far
# more scraped call locations than the feature's own 5-per-item cap,
# hitting the multi-example render/toggle path -- exactly where
# rustdoc panicked with `exit_elem` called on empty class stack parent.
# This is a rustdoc ICE, not a bug in this crate's code.
[[example]]
name = "bell_state"
doc-scrape-examples = false

[[example]]
name = "CHSH"
doc-scrape-examples = false

[[example]]
name = "grover"
doc-scrape-examples = false

[[example]]
name = "grover_noisy"
doc-scrape-examples = false

[[example]]
name = "qasm_export"
doc-scrape-examples = false

[[example]]
name = "qft"
doc-scrape-examples = false

[[example]]
name = "shor_n15"
doc-scrape-examples = false

[[example]]
name = "shor_n15_noisy"
doc-scrape-examples = false

[[example]]
name = "superdense"
doc-scrape-examples = false

[[example]]
name = "teleportation"
doc-scrape-examples = false

[dependencies]
rand = "0.8"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]